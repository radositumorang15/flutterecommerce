plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin harus diterapkan setelah Android dan Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.cart_app"
    compileSdk = 34 // Versi compile SDK terbaru yang disarankan
    ndkVersion = "25.1.8937393" // Pastikan versi NDK yang sesuai, atau hapus jika tidak digunakan

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.cart_app"
        minSdk = 21 // Minimal SDK yang disarankan untuk kompatibilitas
        targetSdk = 34 // Versi target SDK terbaru
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // Tambahkan konfigurasi signing jika diperlukan.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
